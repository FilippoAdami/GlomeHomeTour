[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glome-backend"
version = "0.1.0"
description = "GlomeHomeTour Backend: 2DGS Reconstruction, Ingestion, Floor Plan & Panorama Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.3.0",
    "torchvision",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "opencv-python-headless>=4.8.0",
    "scikit-image>=0.21.0",
    "shapely>=2.0.0",
    "jsonschema>=4.21.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "plyfile>=1.0.0",
    "pydantic>=2.6.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "reconstruction*", "floorplan*", "panorama*", "worker*", "api*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
